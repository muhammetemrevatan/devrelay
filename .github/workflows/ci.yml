name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devrelay_test
          POSTGRES_USER: devrelay_test
          POSTGRES_PASSWORD: devrelay-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devrelay_test -d devrelay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEVRELAY_TEST_POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependency manager
        run: python -m pip install uv==0.12.24
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked python -m mypy
      - name: Check architecture boundaries
        run: uv run --locked lint-imports
      - name: Test
        run: uv run --locked python -m pytest
      - name: Build distributable package
        run: uv build

  container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build control image
        run: docker build --tag devrelay-control:ci .
      - name: Verify container startup and runtime
        shell: bash
        run: |
          docker run --detach --name devrelay-control-smoke \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:18000:8000 devrelay-control:ci
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devrelay-control-smoke)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs devrelay-control-smoke
              exit 1
            fi
            sleep 2
          done
          test "$status" = healthy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18000/health/live
          docker exec devrelay-control-smoke python -c "import importlib.util, os; from pathlib import Path; assert os.geteuid() == 10001; assert importlib.util.find_spec('pytest') is None; assert not Path('/app/src').exists(); assert not Path('/app/AGENTS.md').exists(); assert Path('/app/migrations/versions/0001_task_snapshots.py').is_file()"
      - name: Show container diagnostics
        if: failure()
        run: docker logs devrelay-control-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force devrelay-control-smoke || true
