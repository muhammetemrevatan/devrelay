name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devrelay_test
          POSTGRES_USER: devrelay_test
          POSTGRES_PASSWORD: devrelay-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devrelay_test -d devrelay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEVRELAY_TEST_POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependency manager
        run: python -m pip install uv==0.12.24
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked python -m mypy
      - name: Check architecture boundaries
        run: uv run --locked lint-imports
      - name: Test
        run: uv run --locked python -m pytest
      - name: Build distributable package
        run: uv build

  container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build control image
        run: docker build --tag devrelay-control:ci .
      - name: Verify container startup and runtime
        shell: bash
        run: |
          docker run --detach --name devrelay-control-smoke \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:18000:8000 devrelay-control:ci
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' devrelay-control-smoke)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs devrelay-control-smoke
              exit 1
            fi
            sleep 2
          done
          test "$status" = healthy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18000/health/live
          docker exec devrelay-control-smoke python -c "import importlib.util, os; from pathlib import Path; assert os.geteuid() == 10001; assert importlib.util.find_spec('pytest') is None; assert not Path('/app/src').exists(); assert not Path('/app/AGENTS.md').exists(); assert Path('/app/migrations/versions/0001_task_snapshots.py').is_file()"
      - name: Show container diagnostics
        if: failure()
        run: docker logs devrelay-control-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force devrelay-control-smoke || true

  ci-result:
    needs: [checks, container]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Report CI results on the current PR commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const testedHead = context.payload.pull_request.head.sha;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== 'open' || pull.head.sha !== testedHead) {
              core.notice('Skipping a CI report for a closed PR or outdated commit.');
              return;
            }

            const checks = process.env.CHECKS_RESULT;
            const container = process.env.CONTAINER_RESULT;
            const successful = checks === 'success' && container === 'success';
            const status = successful ? 'SUCCESS' : 'FAILED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**CI ${status}**`,
              '',
              `Commit: ${testedHead}`,
              `Run: [CI results](${runUrl}) (attempt ${process.env.GITHUB_RUN_ATTEMPT})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              `| checks | ${checks} |`,
              `| container | ${container} |`,
              '',
              successful
                ? 'Both required jobs passed for this commit. Human review and merge authorization are still required.'
                : 'Do not merge this commit. Both required jobs must pass.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body,
            });
            await core.summary.addRaw(body).write();
            if (!successful) {
              core.setFailed('Both checks and container must succeed.');
            }
